<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Password Link</title>
</head>
<body style="font-family: Arial; padding: 20px">

  <h2>Generate Password Reset Link</h2>

  <input id="email" type="email" placeholder="Enter email" />
  <button onclick="sendLink()">Send Link</button>

  <p id="msg"></p>

  <script>
    async function sendLink() {
      const email = document.getElementById("email").value;
      const msg = document.getElementById("msg");
const baseUrl =  "https://9000-firebase-backend-test-1776507287720.cluster-mwsteha33jfdowtvzffztbjcj6.cloudworkstations.dev/smart-pea-a";

      msg.innerText = "Sending...";

      try {
        const res = await fetch(`${baseUrl}/generate-password-link`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (data.success) {
          msg.innerText = "Email sent successfully!";
        } else {
          msg.innerText = "Failed to send email";
        }

      } catch (err) {
        msg.innerText = "Error connecting to server";
      }
    }
  </script>

</body>
</html>
